version: '3.7'

services:
    database:
        image: 'mariadb:11.4'
        environment:
            MARIADB_ROOT_PASSWORD: root
            MARIADB_DATABASE: sprint-retrospective
        volumes:
            - data-mariadb:/var/lib/mysql
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h localhost -uroot -proot"]
            interval: 2s
            timeout: 3s
            retries: 20
        restart: always
        stop_grace_period: 0s

    redis:
        image: 'redis:6.2.3'
        restart: always
        volumes:
            - data-redis:/data
        ports:
            - "6379"
        stop_grace_period: 0s

    api:
        # build: https://github.com/RobinJ1995/sprint-retrospective-server.git
        build: .
        image: robinj/sprintretrospective-api
        ports:
            - 5432:5432
        environment:
            DB_ENGINE: 'mariadb'
            DB_HOST: 'database'
            DB_PORT: 3306
            DB_USERNAME: 'root'
            DB_PASSWORD: 'root'
            DB_NAME: 'sprint-retrospective'
            REDIS_URL: 'redis://redis'
            REDIS_PUBSUB_TOPIC: 'updates'
            WEBSOCKET_PUBLIC_BASE_URL: 'ws://localhost:5433/'
            PORT: 5432
            ADMIN_KEY: 'c74c12d6-7842-4fee-b476-47f4cf3f6526'
            SUPPRESS_HEALTHCHECK_LOGGING: 'false'
        stop_grace_period: 0s
        depends_on:
            - database
            - redis
            - websocket
        restart: always

    websocket:
        build: https://github.com/RobinJ1995/sprint-retrospective-websocket-server.git
        image: robinj/sprintretrospective-websocket-server
        ports:
            - 5433:5433
        environment:
            MQ_QUEUE_NAME: 'updates'
            REDIS_URL: 'redis://redis'
            REDIS_PUBSUB_TOPIC: 'updates'
            PORT: 5433
            SUPPRESS_HEALTHCHECK_LOGGING: 'false'
        stop_grace_period: 0s
        depends_on:
            - redis
        restart: always

    frontend:
        build:
            context: https://github.com/RobinJ1995/sprint-retrospective.git
            args:
                API_ENDPOINT: 'http://localhost:5432'
        image: robinj/sprintretrospective-frontend
        ports:
            - 5431:80
        depends_on:
            - api
        restart: always

volumes:
    data-mariadb:
    data-redis:
